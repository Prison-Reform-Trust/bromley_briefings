<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    {% if embed_styles and embedded_styles %}
    <style>
    {{ embedded_styles }}
    </style>
    {% endif %}
</head>

<body style="margin: 0">
    <hr class="plotly-top">
    <h2 id="plotly-title">{{ title }}</h2>
    <h3 id="plotly-subtitle">{{ subtitle }}</h3>
    <div id="plotly-chart-container">
        {{ fig }}
    </div>
    <p id="plotly-source">Source: {{ source }}</p>
    <hr class="plotly-bottom">
    
    <script type="text/javascript">
        // Wait for Plotly chart to be fully rendered
        window.addEventListener('load', function() {
            setTimeout(function() {
                // Get the chart container
                var chartContainer = document.getElementById('plotly-chart-container');
                if (chartContainer) {
                    // Calculate total page height
                    var totalHeight = document.body.scrollHeight;
                    
                    // Use a generic chart ID or extract from URL
                    var chartId = '{{ chart_id | default("plotly-chart") }}';
                    
                    // Send height to parent window
                    window.parent.postMessage({
                        'plotly-height': {
                            [chartId]: totalHeight
                        }
                    }, '*');
                    
                    // Also send height when window resizes
                    window.addEventListener('resize', function() {
                        var newHeight = document.body.scrollHeight;
                        window.parent.postMessage({
                            'plotly-height': {
                                [chartId]: newHeight
                            }
                        }, '*');
                    });
                }
            }, 100); // Small delay to ensure chart is fully rendered
        });
    </script>
</body>
</html>
