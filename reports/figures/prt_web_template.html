<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    {% if embed_styles and embedded_styles %}
    <style>
    {{ embedded_styles }}
    </style>
    {% endif %}
</head>

<body style="margin: 0">
    <hr class="plotly-top">
    <h2 id="plotly-title">{{ title }}</h2>
    <h3 id="plotly-subtitle">{{ subtitle }}</h3>
    <div id="plotly-chart-container">
        {{ fig }}
    </div>
    <p id="plotly-source">Source: {{ source }}</p>
    <hr class="plotly-bottom">
    
    <script type="text/javascript">
        function sendHeightToParent() {
            // Force a small delay to ensure DOM has updated
            setTimeout(function() {
                var totalHeight = document.body.scrollHeight;
                var chartId = '{{ chart_id | default("plotly-chart") }}';
                
                console.log("Sending height:", totalHeight); // Debug log
                
                window.parent.postMessage({
                    'plotly-height': {
                        [chartId]: totalHeight
                    }
                }, '*');
            }, 50);
        }
        
        // Wait for Plotly chart to be fully rendered
        window.addEventListener('load', function() {
            // Hook into the actual Plotly rendering
            if (window.Plotly) {
                // Wait for the plot to be created
                var checkForPlot = setInterval(function() {
                    var plotDivs = document.querySelectorAll('.plotly-graph-div');
                    if (plotDivs.length > 0) {
                        clearInterval(checkForPlot);
                        
                        // Wait for Plotly to finish rendering
                        plotDivs[0].on('plotly_afterplot', function() {
                            console.log("Plotly afterplot fired"); // Debug log
                            sendHeightToParent();
                        });
                        
                        // Also send after a delay as backup
                        setTimeout(sendHeightToParent, 1000);
                    }
                }, 100);
            } else {
                // Fallback if Plotly isn't available
                setTimeout(sendHeightToParent, 1000);
            }
            
            // Send height when window resizes
            window.addEventListener('resize', function() {
                setTimeout(sendHeightToParent, 100);
            });
        });
    </script>
</body>
</html>
