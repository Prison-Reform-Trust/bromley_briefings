<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    {% if embed_styles and embedded_styles %}
    <style>
    {{ embedded_styles }}
    </style>
    {% endif %}
</head>

<body style="margin: 0">
    <hr class="plotly-top">
    <h2 id="plotly-title">{{ title }}</h2>
    <h3 id="plotly-subtitle">{{ subtitle }}</h3>
    <div id="plotly-chart-container">
        {{ fig }}
    </div>
    <p id="plotly-source">Source: {{ source }}</p>
    <hr class="plotly-bottom">
    
    <script type="text/javascript">
        function sendHeightToParent() {
            setTimeout(function() {
                var totalHeight = document.body.scrollHeight;
                var offsetHeight = document.body.offsetHeight;
                var clientHeight = document.body.clientHeight;
                var chartId = 'plotly-chart';
                
                console.log("=== HEIGHT DEBUG ===");
                console.log("scrollHeight:", totalHeight);
                console.log("offsetHeight:", offsetHeight);
                console.log("clientHeight:", clientHeight);
                
                // Check the bottom HR element specifically
                var bottomHr = document.querySelector('hr.plotly-bottom');
                if (bottomHr) {
                    var hrRect = bottomHr.getBoundingClientRect();
                    var hrBottom = hrRect.bottom + window.scrollY;
                    console.log("Bottom HR position from top:", hrBottom);
                    console.log("Bottom HR getBoundingClientRect:", hrRect);
                }
                
                // Also check the source paragraph
                var sourcePara = document.querySelector('#plotly-source');
                if (sourcePara) {
                    var sourceRect = sourcePara.getBoundingClientRect();
                    var sourceBottom = sourceRect.bottom + window.scrollY;
                    console.log("Source paragraph bottom:", sourceBottom);
                }
                
                console.log("Sending height:", totalHeight);
                
                window.parent.postMessage({
                    'plotly-height': {
                        [chartId]: totalHeight
                    }
                }, '*');
            }, 100); // Increased delay
        }
        
        // Wait for Plotly chart to be fully rendered
        window.addEventListener('load', function() {
            console.log("Page loaded, waiting for Plotly...");
            
            // Multiple attempts with increasing delays
            setTimeout(function() {
                console.log("First height calculation attempt:");
                sendHeightToParent();
            }, 500);
            
            setTimeout(function() {
                console.log("Second height calculation attempt:");
                sendHeightToParent();
            }, 1500);
            
            setTimeout(function() {
                console.log("Third height calculation attempt:");
                sendHeightToParent();
            }, 3000);
        });
    </script>
</body>
</html>
