<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    {% if embed_styles and embedded_styles %}
    <style>
    {{ embedded_styles }}
    </style>
    {% endif %}
</head>

<body style="margin: 0">
    <hr class="plotly-top">
    <h2 id="plotly-title">{{ title }}</h2>
    <h3 id="plotly-subtitle">{{ subtitle }}</h3>
    <div id="plotly-chart-container">
        {{ fig }}
    </div>
    <p id="plotly-source">Source: {{ source }}</p>
    <hr class="plotly-bottom">
    
    <script type="text/javascript">
        function sendHeightToParent() {
            setTimeout(function() {
                var chartId = 'plotly-chart';
                
                // Calculate the actual height by finding the bottom-most element
                var bottomHr = document.querySelector('hr.plotly-bottom');
                var actualHeight;
                
                if (bottomHr) {
                    var hrRect = bottomHr.getBoundingClientRect();
                    actualHeight = Math.ceil(hrRect.bottom + window.scrollY + 5); // Add 5px padding
                } else {
                    // Fallback to scrollHeight if HR not found
                    actualHeight = document.body.scrollHeight;
                }
                
                console.log("=== HEIGHT DEBUG ===");
                console.log("scrollHeight:", document.body.scrollHeight);
                console.log("Bottom HR position:", bottomHr ? hrRect.bottom + window.scrollY : 'not found');
                console.log("Calculated height:", actualHeight);
                console.log("Sending height:", actualHeight);
                
                window.parent.postMessage({
                    'plotly-height': {
                        [chartId]: actualHeight
                    }
                }, '*');
            }, 100);
        }
        
        // Wait for Plotly chart to be fully rendered
        window.addEventListener('load', function() {
            console.log("Page loaded, waiting for Plotly...");
            
            // Multiple attempts with increasing delays
            setTimeout(function() {
                console.log("First height calculation attempt:");
                sendHeightToParent();
            }, 500);
            
            setTimeout(function() {
                console.log("Second height calculation attempt:");
                sendHeightToParent();
            }, 1500);
            
            setTimeout(function() {
                console.log("Third height calculation attempt:");
                sendHeightToParent();
            }, 3000);
        });
    </script>
</body>
</html>
