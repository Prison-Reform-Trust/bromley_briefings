<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    {% if embed_styles and embedded_styles %}
    <style>
    {{ embedded_styles }}
    </style>
    {% endif %}
</head>

<body style="margin: 0">
    <hr class="plotly-top">
    <h2 id="plotly-title">{{ title }}</h2>
    <h3 id="plotly-subtitle">{{ subtitle }}</h3>
    <div id="plotly-chart-container">
        {{ fig }}
    </div>
    <p id="plotly-source">Source: {{ source }}</p>
    <hr class="plotly-bottom">
    
    <script type="text/javascript">
        function sendHeightToParent() {
            var totalHeight = document.body.scrollHeight;
            var chartId = '{{ chart_id | default("plotly-chart") }}';
            
            window.parent.postMessage({
                'plotly-height': {
                    [chartId]: totalHeight
                }
            }, '*');
        }
        
        // Wait for Plotly chart to be fully rendered
        window.addEventListener('load', function() {
            // Longer delay to ensure Plotly is fully rendered
            setTimeout(function() {
                sendHeightToParent();
                
                // Also try again after an additional delay
                setTimeout(sendHeightToParent, 500);
                
                // Send height when window resizes
                window.addEventListener('resize', function() {
                    setTimeout(sendHeightToParent, 100);
                });
                
                // Listen for Plotly-specific events if available
                if (window.Plotly) {
                    // Send height after any Plotly redraws
                    document.addEventListener('plotly_afterplot', sendHeightToParent);
                    document.addEventListener('plotly_redraw', sendHeightToParent);
                }
            }, 200); // Small delay to ensure chart is fully rendered
        });
    </script>
</body>
</html>
